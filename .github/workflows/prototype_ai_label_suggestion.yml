name: "[PROTOTYPE] AI-Powered Label Suggestion"

# PROTOTYPE: Uses AI (OpenAI/Gemini/Anthropic) to analyze issues and suggest labels
#
# This workflow demonstrates how to integrate LLMs for intelligent label assignment.
# The AI reads the issue content and suggests appropriate labels based on context.
#
# SUPPORTED PROVIDERS:
# - OpenAI (GPT-4, GPT-3.5)
# - Google Gemini
# - Anthropic Claude
#
# REQUIRED SECRETS (choose one):
# - OPENAI_API_KEY: For OpenAI
# - GEMINI_API_KEY: For Google Gemini
# - ANTHROPIC_API_KEY: For Anthropic Claude
#
# STATUS: Experimental - requires API key setup

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to analyze'
        required: true
        type: number

permissions:
  issues: write
  contents: read

env:
  # Choose your provider: 'openai', 'gemini', or 'anthropic'
  AI_PROVIDER: 'openai'
  # Model to use
  OPENAI_MODEL: 'gpt-4o-mini'
  GEMINI_MODEL: 'gemini-1.5-flash'
  ANTHROPIC_MODEL: 'claude-3-haiku-20240307'

jobs:
  ai-label:
    name: AI Label Suggestion
    runs-on: ubuntu-latest

    # Only process AMD-related issues or manual triggers
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.title, 'AMD') ||
      contains(github.event.issue.title, 'ROCm') ||
      contains(github.event.issue.title, 'MI3') ||
      contains(github.event.issue.body || '', 'rocm')

    steps:
      - name: Get issue details
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            let issueNumber;
            if (context.eventName === 'workflow_dispatch') {
              issueNumber = parseInt('${{ inputs.issue_number }}');
            } else {
              issueNumber = context.payload.issue.number;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            core.setOutput('number', issue.number);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body?.slice(0, 4000) || '');
            core.setOutput('labels', JSON.stringify(issue.labels.map(l => l.name)));

      - name: Prepare prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const availableLabels = {
              // Priority
              'P0-critical': 'Blocks main branch / all PRs / P0 models - 4h response SLA',
              'P1-high': 'Blocks AMD releases / critical functionality - 24h SLA',
              'P2-medium': 'Should be addressed, not urgent - 1 week SLA',
              'P3-low': 'Nice to have, can be deferred',

              // Hardware
              'mi300x': 'MI300X/MI300A hardware specific',
              'mi325x': 'MI325X hardware specific',
              'mi350-series': 'Future MI350 series hardware',

              // Platform
              'rocm-6.x': 'ROCm 6.x specific',
              'rocm-7.x': 'ROCm 7.x specific',

              // Components
              'aiter-backend': 'AITER attention backend',
              'rccl': 'RCCL communication library',

              // Status
              'rocm-blocker': 'Blocks AMD CI entirely',
              'needs-profiling': 'Needs rocprof data to investigate',
              'has-workaround': 'Workaround available',
              'upstream': 'Issue in upstream dependency',
              'flaky-test': 'Intermittent/flaky test failure',

              // Test
              'test:distributed': 'Multi-GPU test related',
              'test:benchmark': 'Performance benchmark test',
            };

            const prompt = `You are a GitHub issue labeling assistant for vLLM, a high-throughput LLM inference engine.
            This issue is related to AMD ROCm hardware support.

            Analyze the following issue and suggest the most appropriate labels from the available options.

            AVAILABLE LABELS:
            ${Object.entries(availableLabels).map(([name, desc]) => `- ${name}: ${desc}`).join('\n')}

            ISSUE TITLE: ${{ steps.issue.outputs.title }}

            ISSUE BODY:
            ${{ steps.issue.outputs.body }}

            EXISTING LABELS: ${{ steps.issue.outputs.labels }}

            INSTRUCTIONS:
            1. Analyze the issue content carefully
            2. Suggest 2-5 labels that best describe this issue
            3. Include exactly ONE priority label (P0-P3) based on severity
            4. Include hardware labels if specific GPU mentioned
            5. Include component labels if specific component mentioned
            6. DO NOT suggest labels already applied

            Respond with a JSON object containing:
            - "labels": array of suggested label names
            - "reasoning": brief explanation for each suggestion
            - "priority_rationale": why you chose that priority level

            JSON ONLY, no other text.`;

            core.setOutput('prompt', prompt);

      - name: Call OpenAI API
        if: env.AI_PROVIDER == 'openai'
        id: openai
        run: |
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d '{
              "model": "${{ env.OPENAI_MODEL }}",
              "messages": [{"role": "user", "content": '"$(echo '${{ steps.prompt.outputs.prompt }}' | jq -Rs .)"'}],
              "temperature": 0.3,
              "max_tokens": 500
            }')

          # Extract content
          CONTENT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // empty')
          if [ -z "$CONTENT" ]; then
            echo "Error: No response from OpenAI"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ai_response<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Gemini API
        if: env.AI_PROVIDER == 'gemini'
        id: gemini
        run: |
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/${{ env.GEMINI_MODEL }}:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{
              "contents": [{"parts": [{"text": '"$(echo '${{ steps.prompt.outputs.prompt }}' | jq -Rs .)"'}]}],
              "generationConfig": {"temperature": 0.3, "maxOutputTokens": 500}
            }')

          CONTENT=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // empty')
          if [ -z "$CONTENT" ]; then
            echo "Error: No response from Gemini"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ai_response<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Call Anthropic API
        if: env.AI_PROVIDER == 'anthropic'
        id: anthropic
        run: |
          RESPONSE=$(curl -s https://api.anthropic.com/v1/messages \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.ANTHROPIC_API_KEY }}" \
            -H "anthropic-version: 2023-06-01" \
            -d '{
              "model": "${{ env.ANTHROPIC_MODEL }}",
              "max_tokens": 500,
              "messages": [{"role": "user", "content": '"$(echo '${{ steps.prompt.outputs.prompt }}' | jq -Rs .)"'}]
            }')

          CONTENT=$(echo "$RESPONSE" | jq -r '.content[0].text // empty')
          if [ -z "$CONTENT" ]; then
            echo "Error: No response from Anthropic"
            echo "$RESPONSE"
            exit 1
          fi

          echo "ai_response<<EOF" >> $GITHUB_OUTPUT
          echo "$CONTENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Process AI response and apply labels
        uses: actions/github-script@v7
        with:
          script: |
            // Get AI response based on provider
            let aiResponse = '';
            const provider = '${{ env.AI_PROVIDER }}';

            if (provider === 'openai') {
              aiResponse = `${{ steps.openai.outputs.ai_response }}`;
            } else if (provider === 'gemini') {
              aiResponse = `${{ steps.gemini.outputs.ai_response }}`;
            } else if (provider === 'anthropic') {
              aiResponse = `${{ steps.anthropic.outputs.ai_response }}`;
            }

            // Parse JSON from response (handle markdown code blocks)
            let parsed;
            try {
              // Try to extract JSON from markdown code blocks
              const jsonMatch = aiResponse.match(/```json?\s*([\s\S]*?)\s*```/) ||
                               aiResponse.match(/\{[\s\S]*\}/);
              const jsonStr = jsonMatch ? (jsonMatch[1] || jsonMatch[0]) : aiResponse;
              parsed = JSON.parse(jsonStr);
            } catch (e) {
              core.error(`Failed to parse AI response: ${e.message}`);
              core.error(`Response: ${aiResponse}`);
              return;
            }

            const suggestedLabels = parsed.labels || [];
            const reasoning = parsed.reasoning || '';
            const priorityRationale = parsed.priority_rationale || '';

            // Get current labels
            const currentLabels = JSON.parse('${{ steps.issue.outputs.labels }}');

            // Filter out already-applied labels and validate
            const validLabels = [
              'P0-critical', 'P1-high', 'P2-medium', 'P3-low',
              'mi300x', 'mi325x', 'mi350-series',
              'rocm-6.x', 'rocm-7.x',
              'aiter-backend', 'rccl',
              'rocm-blocker', 'needs-profiling', 'has-workaround', 'upstream', 'flaky-test',
              'test:distributed', 'test:benchmark',
            ];

            const labelsToAdd = suggestedLabels.filter(l =>
              validLabels.includes(l) && !currentLabels.includes(l)
            );

            if (labelsToAdd.length > 0) {
              // Apply labels
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt('${{ steps.issue.outputs.number }}'),
                labels: labelsToAdd,
              });

              // Add explanatory comment
              let comment = `🤖 **AI Label Suggestion** (powered by ${provider})\n\n`;
              comment += `**Suggested labels:** ${labelsToAdd.map(l => `\`${l}\``).join(', ')}\n\n`;

              if (typeof reasoning === 'object') {
                comment += `**Reasoning:**\n`;
                for (const [label, reason] of Object.entries(reasoning)) {
                  comment += `- \`${label}\`: ${reason}\n`;
                }
              } else {
                comment += `**Reasoning:** ${reasoning}\n`;
              }

              if (priorityRationale) {
                comment += `\n**Priority rationale:** ${priorityRationale}\n`;
              }

              comment += `\n_If these labels are incorrect, please update them manually._`;

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt('${{ steps.issue.outputs.number }}'),
                body: comment,
              });

              core.info(`Applied labels: ${labelsToAdd.join(', ')}`);
            } else {
              core.info('No new labels to apply');
            }

            // Summary
            let summary = '## AI Label Suggestion\n\n';
            summary += `**Provider:** ${provider}\n`;
            summary += `**Issue:** #${{ steps.issue.outputs.number }}\n`;
            summary += `**Suggested:** ${suggestedLabels.join(', ')}\n`;
            summary += `**Applied:** ${labelsToAdd.join(', ') || 'None (already labeled)'}\n`;

            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
