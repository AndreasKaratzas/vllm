name: Label issues based on keywords
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write          # needed so the workflow can add labels
  contents: read
concurrency:
  group: issue-labeler-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  add-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Label issues based on keywords
        id: label-step
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            // ================================================================
            // LABEL CONFIGURATION
            // Add new labels and their detection rules here
            // ================================================================
            const labelConfig = {
              // ==============================================================
              // ROCm PLATFORM LABEL (existing upstream config - preserved)
              // ==============================================================
              rocm: {
                keywords: [
                  { term: "composable kernel", searchIn: "both" },
                  { term: "rccl", searchIn: "body" },
                  { term: "migraphx", searchIn: "title" },
                  { term: "hipgraph", searchIn: "both" },
                  { term: "ROCm System Management Interface", searchIn: "body" },
                ],
                substrings: [
                  { term: "VLLM_ROCM_", searchIn: "both" },
                  { term: "aiter", searchIn: "title" },
                  { term: "rocm", searchIn: "title" },
                  { term: "amd", searchIn: "title" },
                  { term: "hip-", searchIn: "both" },
                  { term: "gfx", searchIn: "both" },
                  { term: "cdna", searchIn: "both" },
                  { term: "rdna", searchIn: "both" },
                  { term: "torch_hip", searchIn: "body" },
                  { term: "_hip", searchIn: "both" },
                  { term: "hip_", searchIn: "both" },
                  { term: "hipify", searchIn: "both" },
                ],
                regexPatterns: [
                  {
                    pattern: "\\bmi\\d{3}[a-z]*\\b",
                    description: "AMD GPU names (mi + 3 digits + optional letters)",
                    flags: "gi",
                    searchIn: "both"
                  }
                ],
              },

              // ==============================================================
              // CPU LABEL (existing upstream config - preserved)
              // ==============================================================
              cpu: {
                keywords: [
                  { term: "CPU Backend", searchIn: "title" },
                  { term: "x86", searchIn: "title" },
                  { term: "ARM", searchIn: "title" },
                  { term: "Apple Silicon", searchIn: "title" },
                  { term: "IBM Z", searchIn: "title" },
                ],
                substrings: [],
                regexPatterns: [],
              },

              // ==============================================================
              // AMD HARDWARE LABELS
              // ==============================================================
              "mi300x": {
                keywords: [],
                substrings: [
                  { term: "mi300x", searchIn: "both" },
                  { term: "mi300a", searchIn: "both" },
                  { term: "MI300X", searchIn: "both" },
                  { term: "MI300A", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "mi325x": {
                keywords: [],
                substrings: [
                  { term: "mi325x", searchIn: "both" },
                  { term: "MI325X", searchIn: "both" },
                  { term: "mi325", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "mi350-series": {
                keywords: [],
                substrings: [
                  { term: "mi350", searchIn: "both" },
                  { term: "MI350", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              // ==============================================================
              // ROCm VERSION LABELS
              // ==============================================================
              "rocm-6.x": {
                keywords: [],
                substrings: [
                  { term: "rocm 6.", searchIn: "both" },
                  { term: "rocm-6.", searchIn: "both" },
                  { term: "ROCm 6.", searchIn: "both" },
                ],
                regexPatterns: [
                  {
                    pattern: "rocm[:\\s-]?6\\.\\d",
                    description: "ROCm 6.x version",
                    flags: "gi",
                    searchIn: "both"
                  }
                ],
              },

              "rocm-7.x": {
                keywords: [],
                substrings: [
                  { term: "rocm 7.", searchIn: "both" },
                  { term: "rocm-7.", searchIn: "both" },
                  { term: "ROCm 7.", searchIn: "both" },
                ],
                regexPatterns: [
                  {
                    pattern: "rocm[:\\s-]?7\\.\\d",
                    description: "ROCm 7.x version",
                    flags: "gi",
                    searchIn: "both"
                  }
                ],
              },

              // ==============================================================
              // AMD COMPONENT LABELS
              // ==============================================================
              "aiter-backend": {
                keywords: [
                  { term: "aiter", searchIn: "both" },
                  { term: "AITER", searchIn: "both" },
                ],
                substrings: [
                  { term: "VLLM_ROCM_USE_AITER", searchIn: "both" },
                  { term: "aiter backend", searchIn: "both" },
                  { term: "aiter attention", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "rccl": {
                keywords: [
                  { term: "rccl", searchIn: "both" },
                  { term: "RCCL", searchIn: "both" },
                ],
                substrings: [
                  { term: "collective communication", searchIn: "body" },
                ],
                regexPatterns: [],
              },

              // ==============================================================
              // AMD BLOCKER LABELS
              // ==============================================================
              "rocm-blocker": {
                keywords: [],
                substrings: [
                  { term: "blocks amd", searchIn: "both" },
                  { term: "blocks rocm", searchIn: "both" },
                  { term: "rocm ci broken", searchIn: "both" },
                  { term: "amd ci broken", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              // ==============================================================
              // AMD STATUS LABELS
              // ==============================================================
              "needs-profiling": {
                keywords: [],
                substrings: [
                  { term: "need profiling", searchIn: "both" },
                  { term: "needs profiling", searchIn: "both" },
                  { term: "rocprof", searchIn: "body" },
                ],
                regexPatterns: [],
              },

              "has-workaround": {
                keywords: [
                  { term: "workaround", searchIn: "both" },
                ],
                substrings: [
                  { term: "work around", searchIn: "both" },
                  { term: "temporary fix", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "upstream": {
                keywords: [],
                substrings: [
                  { term: "upstream bug", searchIn: "both" },
                  { term: "upstream issue", searchIn: "both" },
                  { term: "pytorch bug", searchIn: "both" },
                  { term: "rocm bug", searchIn: "both" },
                  { term: "triton bug", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              // ==============================================================
              // AMD TEST LABELS
              // ==============================================================
              "flaky-test": {
                keywords: [
                  { term: "flaky", searchIn: "both" },
                  { term: "intermittent", searchIn: "both" },
                ],
                substrings: [
                  { term: "sometimes passes", searchIn: "both" },
                  { term: "sometimes fails", searchIn: "both" },
                  { term: "random failure", searchIn: "both" },
                  { term: "flaky test", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "test:distributed": {
                keywords: [],
                substrings: [
                  { term: "multi-gpu test", searchIn: "both" },
                  { term: "distributed test", searchIn: "both" },
                  { term: "4 gpu", searchIn: "both" },
                  { term: "8 gpu", searchIn: "both" },
                ],
                regexPatterns: [],
              },

              "test:benchmark": {
                keywords: [
                  { term: "benchmark", searchIn: "title" },
                ],
                substrings: [
                  { term: "benchmark_serving", searchIn: "both" },
                  { term: "benchmark_throughput", searchIn: "both" },
                  { term: "tokens/sec", searchIn: "both" },
                  { term: "throughput test", searchIn: "both" },
                ],
                regexPatterns: [],
              },
            };
            // Helper function to create regex based on search type
            function createSearchRegex(term, type) {
              // Escape special regex characters in the term
              const escapedTerm = term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              switch (type) {
                case 'keyword':
                  // Word boundary search - matches whole words only
                  return new RegExp(`\\b${escapedTerm}\\b`, "gi");
                case 'substring':
                  // Substring search - matches anywhere in the text
                  return new RegExp(escapedTerm, "gi");
                default:
                  throw new Error(`Unknown search type: ${type}`);
              }
            }
            // Helper function to find matching terms in text with line information
            function findMatchingTermsWithLines(text, searchTerms = [], searchType = 'keyword', searchLocation = '') {
              const matches = [];
              const lines = text.split('\n');
              for (const termConfig of searchTerms) {
                let regex;
                let term, searchIn, pattern, description, flags;
                // Handle different input formats (string or object)
                if (typeof termConfig === 'string') {
                  term = termConfig;
                  searchIn = 'both'; // default
                } else {
                  term = termConfig.term;
                  searchIn = termConfig.searchIn || 'both';
                  pattern = termConfig.pattern;
                  description = termConfig.description;
                  flags = termConfig.flags;
                }
                // Skip if this term shouldn't be searched in the current location
                if (searchIn !== 'both' && searchIn !== searchLocation) {
                  continue;
                }
                // Create appropriate regex
                if (searchType === 'regex') {
                  regex = new RegExp(pattern, flags || "gi");
                } else {
                  regex = createSearchRegex(term, searchType);
                }
                const termMatches = [];
                // Check each line for matches
                lines.forEach((line, lineIndex) => {
                  const lineMatches = line.match(regex);
                  if (lineMatches) {
                    lineMatches.forEach(match => {
                      termMatches.push({
                        match: match,
                        lineNumber: lineIndex + 1,
                        lineContent: line.trim(),
                        searchType: searchType,
                        searchLocation: searchLocation,
                        originalTerm: term || pattern,
                        description: description,
                        // Show context around the match in the line
                        context: line.length > 100 ?
                          line.substring(Math.max(0, line.toLowerCase().indexOf(match.toLowerCase()) - 30),
                                       line.toLowerCase().indexOf(match.toLowerCase()) + match.length + 30) + '...'
                          : line.trim()
                      });
                    });
                  }
                });
                if (termMatches.length > 0) {
                  matches.push({
                    term: term || (description || pattern),
                    searchType: searchType,
                    searchLocation: searchLocation,
                    searchIn: searchIn,
                    pattern: pattern,
                    matches: termMatches,
                    count: termMatches.length
                  });
                }
              }
              return matches;
            }
            // Helper function to check if label should be added
            async function processLabel(labelName, config) {
              const body = context.payload.issue.body || "";
              const title = context.payload.issue.title || "";
              core.notice(`Processing label: ${labelName}`);
              core.notice(`Issue Title: "${title}"`);
              core.notice(`Issue Body length: ${body.length} characters`);
              let shouldAddLabel = false;
              let allMatches = [];
              let reason = '';
              const keywords = config.keywords || [];
              const substrings = config.substrings || [];
              const regexPatterns = config.regexPatterns || [];
              core.notice(`Searching with ${keywords.length} keywords, ${substrings.length} substrings, and ${regexPatterns.length} regex patterns`);
              // Search in title
              if (title.trim()) {
                core.notice(`Searching in title: "${title}"`);
                const titleKeywordMatches = findMatchingTermsWithLines(title, keywords, 'keyword', 'title');
                const titleSubstringMatches = findMatchingTermsWithLines(title, substrings, 'substring', 'title');
                const titleRegexMatches = findMatchingTermsWithLines(title, regexPatterns, 'regex', 'title');
                allMatches.push(...titleKeywordMatches, ...titleSubstringMatches, ...titleRegexMatches);
              }
              // Search in body
              if (body.trim()) {
                core.notice(`Searching in body (${body.length} characters)`);
                const bodyKeywordMatches = findMatchingTermsWithLines(body, keywords, 'keyword', 'body');
                const bodySubstringMatches = findMatchingTermsWithLines(body, substrings, 'substring', 'body');
                const bodyRegexMatches = findMatchingTermsWithLines(body, regexPatterns, 'regex', 'body');
                allMatches.push(...bodyKeywordMatches, ...bodySubstringMatches, ...bodyRegexMatches);
              }
              if (allMatches.length > 0) {
                core.notice(`Found ${allMatches.length} matching term(s):`);
                for (const termMatch of allMatches) {
                  const locationText = termMatch.searchLocation === 'title' ? 'title' : 'body';
                  const searchInText = termMatch.searchIn === 'both' ? 'both' : termMatch.searchIn;
                  if (termMatch.searchType === 'regex') {
                    core.notice(`  📍 Regex: "${termMatch.term}" (pattern: ${termMatch.pattern}) found ${termMatch.count} time(s) in ${locationText} (configured to search in: ${searchInText}):`);
                  } else {
                    core.notice(`  📍 Term: "${termMatch.term}" (${termMatch.searchType} search) found ${termMatch.count} time(s) in ${locationText} (configured to search in: ${searchInText}):`);
                  }
                  // Show details for each match
                  termMatch.matches.forEach((match, index) => {
                    core.notice(`    ${index + 1}. Line ${match.lineNumber} in ${match.searchLocation}: "${match.match}" [${match.searchType}]`);
                    if (match.description) {
                      core.notice(`       Description: ${match.description}`);
                    }
                    core.notice(`       Context: ${match.context}`);
                    if (match.lineContent !== match.context) {
                      core.notice(`       Full line: ${match.lineContent}`);
                    }
                  });
                }
                shouldAddLabel = true;
                const totalMatches = allMatches.reduce((sum, t) => sum + t.count, 0);
                const titleMatches = allMatches.filter(t => t.searchLocation === 'title').reduce((sum, t) => sum + t.count, 0);
                const bodyMatches = allMatches.filter(t => t.searchLocation === 'body').reduce((sum, t) => sum + t.count, 0);
                const keywordMatches = allMatches.filter(t => t.searchType === 'keyword').reduce((sum, t) => sum + t.count, 0);
                const substringMatches = allMatches.filter(t => t.searchType === 'substring').reduce((sum, t) => sum + t.count, 0);
                const regexMatches = allMatches.filter(t => t.searchType === 'regex').reduce((sum, t) => sum + t.count, 0);
                reason = `Found ${totalMatches} total matches (${titleMatches} in title, ${bodyMatches} in body) - ${keywordMatches} keyword matches, ${substringMatches} substring matches, ${regexMatches} regex matches`;
              }
              core.notice(`Final decision: ${shouldAddLabel ? 'ADD LABEL' : 'DO NOT ADD LABEL'}`);
              core.notice(`Reason: ${reason || 'No matching terms found'}`);
              if (shouldAddLabel) {
                const existingLabels = context.payload.issue.labels.map(l => l.name);
                if (!existingLabels.includes(labelName)) {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    labels: [labelName],
                  });
                  core.notice(`Label "${labelName}" added. ${reason}`);
                  return true;
                }
                core.notice(`Label "${labelName}" already present.`);
                return false;
              }
              core.notice(`No matching terms found for label "${labelName}".`);
              return false;
            }
            // Process all configured labels
            const labelsAddedResults = await Promise.all(
              Object.entries(labelConfig).map(([labelName, config]) =>
                processLabel(labelName, config).then(added => ({ labelName, added }))
              )
            );

            const numLabelsAdded = labelsAddedResults.filter(r => r.added).length;
            core.notice(`Processing complete. ${numLabelsAdded} label(s) added.`);

            // Return which labels were added for the next step
            const addedLabels = labelsAddedResults.filter(r => r.added).map(r => r.labelName);

            // If rocm label was added, also add 'amd' label for project routing
            // (unless 'amd-ci' is already present - CI issues go to different project)
            const existingLabels = context.payload.issue.labels.map(l => l.name);
            if (addedLabels.includes('rocm') || existingLabels.includes('rocm')) {
              const hasAmdCi = existingLabels.includes('amd-ci');
              const hasAmd = existingLabels.includes('amd');

              if (!hasAmd && !hasAmdCi) {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  labels: ['amd'],
                });
                addedLabels.push('amd');
                core.notice('Added "amd" label for project routing (rocm detected)');
              }
            }

            core.setOutput('labels_added', JSON.stringify(addedLabels));
            return addedLabels;

      - name: CC users for labeled issues
        if: steps.label-step.outputs.labels_added != '[]'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8.0.0
        with:
          script: |
            // ================================================================
            // CC CONFIGURATION
            // Map labels to GitHub users to CC
            // ================================================================
            const ccConfig = {
              // Core ROCm maintainers
              rocm: {
                users: ['hongxiayang', 'tjtanaa', 'vllmellm'],
                message: 'CC {users} for ROCm-related issue'
              },
              // Hardware-specific
              "mi300x": {
                users: ['hongxiayang', 'tjtanaa'],
                message: 'CC {users} for MI300X hardware issue'
              },
              "mi325x": {
                users: ['hongxiayang', 'tjtanaa'],
                message: 'CC {users} for MI325X hardware issue'
              },
              // Component-specific
              "aiter-backend": {
                users: ['tjtanaa'],
                message: 'CC {users} for AITER backend issue'
              },
              "rccl": {
                users: ['hongxiayang'],
                message: 'CC {users} for RCCL communication issue'
              },
              // Blockers - notify full team
              "rocm-blocker": {
                users: ['hongxiayang', 'tjtanaa', 'gshtras', 'vllmellm'],
                message: 'CC {users} - ROCm blocker issue needs attention'
              },
            };
            
            const labelsAdded = JSON.parse('${{ steps.label-step.outputs.labels_added }}');
            core.notice(`Labels added: ${labelsAdded.join(', ')}`);
            
            // Get existing comments to check for already mentioned users
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const issueBody = context.payload.issue.body || '';
            const allExistingText = issueBody + '\n' + comments.data.map(c => c.body).join('\n');
            
            // Process each label that was added
            for (const label of labelsAdded) {
              if (ccConfig[label]) {
                const config = ccConfig[label];
                const usersToMention = [];
                
                // Check which users haven't been mentioned yet
                for (const user of config.users) {
                  const mentionPattern = new RegExp(`@${user}\\b`, 'i');
                  if (!mentionPattern.test(allExistingText)) {
                    usersToMention.push(user);
                  } else {
                    core.notice(`@${user} already mentioned for label "${label}", skipping`);
                  }
                }
                
                // Post comment if there are users to mention
                if (usersToMention.length > 0) {
                  const mentions = usersToMention.map(u => `@${u}`).join(' ');
                  const message = config.message.replace('{users}', mentions);
                  
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: message
                  });
                  
                  core.notice(`CC comment added for label "${label}": ${mentions}`);
                } else {
                  core.notice(`All users for label "${label}" already mentioned, skipping comment`);
                }
              }
            }