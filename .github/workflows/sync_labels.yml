name: Sync AMD Labels

# This workflow creates/updates AMD-specific labels in the repository.
# It uses skip-delete: true to avoid removing any existing labels.
#
# Trigger: Manual only (workflow_dispatch) - safe for upstream
# Restricted to: AMD team members only

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (no changes made)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  issues: write
  contents: read

jobs:
  sync-labels:
    name: Sync AMD Labels
    runs-on: ubuntu-latest

    # =========================================================================
    # AMD TEAM MEMBERS - Update this list as needed
    # =========================================================================
    if: |
      github.actor == 'AndreasKaratzas' ||
      github.actor == 'hongxiayang' ||
      github.actor == 'tjtanaa' ||
      github.actor == 'gshtras' ||
      github.actor == 'amdfaa' ||
      github.actor == 'zhuyuhua-v' ||
      github.actor == 'gyohuangxin' ||
      github.actor == 'kenroche' ||
      github.actor == 'vllmellm'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Sync Labels from labels-amd.yml
        uses: crazy-max/ghaction-github-labeler@de749cf181958193cb7debf1a9c5bb28922fc5a1  # v5.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/labels-amd.yml
          skip-delete: true
          dry-run: ${{ inputs.dry-run }}

      - name: Summary
        run: |
          echo "## AMD Label Sync Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry run:** ${{ inputs.dry-run }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Labels were synced from \`.github/labels-amd.yml\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: \`skip-delete: true\` ensures no existing labels are removed." >> $GITHUB_STEP_SUMMARY
