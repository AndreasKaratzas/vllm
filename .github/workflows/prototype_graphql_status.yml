name: "[PROTOTYPE] Project Status Updates via GraphQL"

# PROTOTYPE: Automatically updates project board status based on labels
# This uses GitHub GraphQL API to move items between columns
#
# STATUS: Not production-ready - requires testing and PROJECT_TOKEN with additional scopes
#
# Required token scopes:
# - project (read/write)
# - read:org
#
# To enable: Replace secrets.PROJECT_TOKEN with a token that has these scopes

on:
  issues:
    types: [labeled, unlabeled, closed, reopened]
  pull_request_target:
    types: [labeled, unlabeled, closed, reopened]

env:
  # Project IDs - Get these from: gh api graphql -f query='{ organization(login: "vllm-project") { projectV2(number: 38) { id } } }'
  AMD_PROJECT_ID: "PVT_kwDOABC123"  # TODO: Replace with actual project ID
  AMD_CI_PROJECT_ID: "PVT_kwDOXYZ789"  # TODO: Replace with actual project ID

  # Status field IDs - Get from project settings
  STATUS_FIELD_ID: "PVTSSF_abc123"  # TODO: Replace

  # Status option IDs
  STATUS_BACKLOG: "option_id_1"
  STATUS_READY: "option_id_2"
  STATUS_IN_PROGRESS: "option_id_3"
  STATUS_IN_REVIEW: "option_id_4"
  STATUS_DONE: "option_id_5"

jobs:
  update-status:
    name: Update Project Status
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'amd') ||
      contains(github.event.issue.labels.*.name, 'amd-ci') ||
      contains(github.event.issue.labels.*.name, 'rocm')

    steps:
      - name: Determine target status
        id: status
        uses: actions/github-script@v7
        with:
          script: |
            const item = context.payload.issue || context.payload.pull_request;
            const labels = item.labels.map(l => l.name);
            const isClosed = item.state === 'closed';

            let statusOptionId = '${{ env.STATUS_BACKLOG }}';
            let statusName = 'Backlog';

            if (isClosed) {
              statusOptionId = '${{ env.STATUS_DONE }}';
              statusName = 'Done';
            } else if (labels.includes('pr-ready') || labels.includes('ready')) {
              statusOptionId = '${{ env.STATUS_IN_REVIEW }}';
              statusName = 'In review';
            } else if (labels.includes('in-progress') || labels.includes('investigating')) {
              statusOptionId = '${{ env.STATUS_IN_PROGRESS }}';
              statusName = 'In progress';
            } else if (labels.some(l => ['P0-critical', 'P1-high', 'rocm-blocker', 'needs-triage'].includes(l))) {
              statusOptionId = '${{ env.STATUS_READY }}';
              statusName = 'Ready';
            }

            core.setOutput('status_option_id', statusOptionId);
            core.setOutput('status_name', statusName);
            core.setOutput('item_id', item.node_id);

      - name: Get project item ID
        id: get-item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Query to find the item in the project
            const query = `
              query($nodeId: ID!) {
                node(id: $nodeId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                  ... on PullRequest {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project { id }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, {
              nodeId: '${{ steps.status.outputs.item_id }}'
            });

            const items = result.node?.projectItems?.nodes || [];
            const projectItem = items.find(i =>
              i.project.id === '${{ env.AMD_PROJECT_ID }}' ||
              i.project.id === '${{ env.AMD_CI_PROJECT_ID }}'
            );

            if (projectItem) {
              core.setOutput('project_item_id', projectItem.id);
              core.setOutput('found', 'true');
            } else {
              core.setOutput('found', 'false');
            }

      - name: Update project item status
        if: steps.get-item.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item { id }
                }
              }
            `;

            // Determine which project this item belongs to
            const labels = (context.payload.issue || context.payload.pull_request).labels.map(l => l.name);
            const projectId = labels.includes('amd-ci')
              ? '${{ env.AMD_CI_PROJECT_ID }}'
              : '${{ env.AMD_PROJECT_ID }}';

            await github.graphql(mutation, {
              projectId: projectId,
              itemId: '${{ steps.get-item.outputs.project_item_id }}',
              fieldId: '${{ env.STATUS_FIELD_ID }}',
              optionId: '${{ steps.status.outputs.status_option_id }}'
            });

            core.info(`Updated status to: ${{ steps.status.outputs.status_name }}`);

      - name: Summary
        run: |
          echo "## Project Status Update" >> $GITHUB_STEP_SUMMARY
          echo "**Target Status:** ${{ steps.status.outputs.status_name }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.get-item.outputs.found }}" == "true" ]; then
            echo "**Result:** Updated successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** Item not found in project (may need to be added first)" >> $GITHUB_STEP_SUMMARY
          fi
