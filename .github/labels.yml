# GitHub Labels Configuration for AMD vLLM
# This file defines all labels used for issue/PR management
# Labels can be synced using GitHub Actions with the labels action
# Reference: https://github.com/EndBug/label-sync

# =============================================================================
# PRIORITY LABELS
# =============================================================================
# Used for SLA tracking and triage prioritization

- name: P0-critical
  color: "B60205"
  description: "Blocks main branch / all PRs / P0 models - 4h response SLA"

- name: P1-high
  color: "D93F0B"
  description: "Blocks AMD releases / critical functionality - 24h response SLA"

- name: P2-medium
  color: "FBCA04"
  description: "Should be addressed, not urgent - 1 week SLA"

- name: P3-low
  color: "0E8A16"
  description: "Nice to have, can be deferred - No SLA"

# =============================================================================
# ISSUE TYPE LABELS
# =============================================================================

- name: bug
  color: "D73A4A"
  description: "Something isn't working"

- name: ci-failure
  color: "E99695"
  description: "CI/CD test failure"

- name: performance
  color: "F9D0C4"
  description: "Performance regression or optimization"

- name: enhancement
  color: "A2EEEF"
  description: "New feature or improvement"

- name: regression
  color: "D4C5F9"
  description: "Previously working, now broken"

- name: model-support
  color: "BFDADC"
  description: "New model architecture support"

- name: infrastructure
  color: "C2E0C6"
  description: "CI/build system issues"

- name: documentation
  color: "0075CA"
  description: "Documentation improvements"

# =============================================================================
# STATUS LABELS
# =============================================================================

- name: needs-triage
  color: "D93F0B"
  description: "Awaiting initial assessment"

- name: needs-repro
  color: "FEF2C0"
