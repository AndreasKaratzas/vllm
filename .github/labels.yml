- name: blocked
  color: "B60205"
  description: "Blocked by external dependency"

- name: pr-ready
  color: "28B463"
  description: "PR exists, ready for review"

- name: resolved
  color: "2ECC71"
  description: "Fixed and verified"

- name: duplicate
  color: "CFD3D7"
  description: "Duplicate of existing issue"

- name: help-wanted
  color: "008672"
  description: "Good for community contributions"

- name: good-first-issue
  color: "7057FF"
  description: "Good for newcomers to ROCm/vLLM"

