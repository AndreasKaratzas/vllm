# For vllm script, with -t option (tensor parallel size).
# bash .buildkite/lm-eval-harness/run-lm-eval-chartqa-vllm-vlm-baseline.sh -m Qwen/Qwen2.5-VL-7B-Instruct -l 2500 -t 1

model_name: "Qwen/Qwen2.5-VL-7B-Instruct"
backend: "vllm-vlm"
tasks:
- name: "chartqa"
  metrics:
  - name: "relaxed_accuracy,none"
    value: 0.855
# Some CI workers can carry an older ChartQA dataset_info.json using the
# legacy feature type "List", which current datasets releases no longer read.
# Refresh the dataset cache before evaluating; the benchmark and thresholds are
# unchanged.
force_dataset_redownload: true
limit: 2500
num_fewshot: 0
