group: Hardware - AMD Build

# ROCm image flow:
# 1. Ensure the runtime image for this commit's inputs exists: each source
#    dependency wheel and the runtime itself are content-keyed and only built
#    on a miss (.buildkite/scripts/rocm/build-runtime.sh).
# 2. Build the per-commit image: the runtime plus one vLLM layer. GPU jobs pull
#    it directly.
steps:
  - label: "AMD: :docker: build ROCm runtime"
    key: build-rocm-runtime-amd
    depends_on: []
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build-runtime.sh
    concurrency: 1
    concurrency_group: "vllm/rocm/runtime-build/$BUILDKITE_COMMIT"
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "tty"
      TERM: "xterm-256color"
      PYTORCH_ROCM_ARCH: "gfx90a;gfx942;gfx950"
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1

  - label: "AMD: :docker: build test image"
    key: image-build-amd
    soft_fail: false
    depends_on:
      - build-rocm-runtime-amd
    device: amd_cpu
    no_plugin: true
    commands:
      - bash .buildkite/scripts/rocm/build-test-image.sh
      - bash .buildkite/scripts/rocm/smoke-test-image.sh
    env:
      DOCKER_BUILDKIT: "1"
      BUILDKIT_PROGRESS: "tty"
      TERM: "xterm-256color"
      VLLM_BAKE_FILE: "docker/docker-bake-rocm.hcl"
      PYTORCH_ROCM_ARCH: "gfx90a;gfx942;gfx950"
      IMAGE_TAG: "rocm/vllm-ci:build-$BUILDKITE_BUILD_ID"
      REMOTE_VLLM: "0"
    retry:
      automatic:
        - exit_status: 1  # Transient Docker/BuildKit failure
          limit: 1
        - exit_status: -1  # Agent was lost
          limit: 1
        - exit_status: -10  # Agent was lost
          limit: 1
